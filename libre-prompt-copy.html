<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Libre English | プロンプトをコピー</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; background: #fff; color: #292929; }
    .panel { border: 1px solid #e8e8e8; border-radius: 12px; padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .title { font-weight: 700; font-size: 14px; }
    .hint { font-size: 12px; color: #777; margin-top: 5px; line-height: 1.6; }
    button { flex-shrink: 0; border: 0; border-radius: 8px; padding: 11px 16px; background: #242424; color: white; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
    button:hover { background: #444; }
    button:focus-visible { outline: 3px solid #8aaaff; outline-offset: 2px; }
    #status { font-size: 12px; color: #676767; margin: 7px 2px 0; min-height: 18px; }
    @media(max-width: 380px){ .panel { align-items: stretch; flex-direction: column; } button { width: 100%; } }
  </style>
</head>
<body>
  <div class="panel">
    <div>
      <div class="title">トピック作文（日本語→英語）プロンプト</div>
      <div class="hint">コピーしてChatGPTに貼り付けてください。</div>
    </div>
    <button type="button" id="copy">📋 コピーする</button>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
  <script>
    // ↓ このバッククォート（`）内を実際のプロンプト全文に書き換えてください。
    const PROMPT = `英語学習用にこの英訳をください。

【ここに日記を貼り付ける】

下の例のフォーマットに沿って解説ポイントもつけてください。

- **work hard for ～「～のために一生懸命頑張る」**
    - **work hard for + 名詞** で「～のために一生懸命努力する」
    - 試験、目標、仕事などのために頑張るときに使えます
    - 例）**She worked hard for the competition.**
        
        「彼女はその大会のために一生懸命頑張りました。」
        
- **in my third year of high school「高校3年生のとき」**
    - **in my first / second / third year of ～** で「～の1年目 / 2年目 / 3年目」
    - 学校生活や大学生活について話すときに便利です
    - 例）**I started working part-time in my second year of college.**
        
        「大学2年生のときにアルバイトを始めました。」
        
- **pass an exam「試験に受かる」**
    - **pass + 試験** で「試験に合格する」
    - 「試験を受ける」は **take an exam** なので注意
    - 例）**He passed the driving test last month.**
        
        「彼は先月、運転免許の試験に合格しました。」
        
- **be disappointed「がっかりする / 悔しい」**
    - 期待していた結果にならなかったときに使います
    - **be disappointed with / about ～** の形もよく使います
    - 例）**I was disappointed with my test result.**
        
        「私は試験の結果にがっかりしました。」`;

    const button = document.getElementById('copy');
    const status = document.getElementById('status');

    button.addEventListener('click', async () => {
      try {
        if (!navigator.clipboard?.writeText) throw new Error('Clipboard API unavailable');
        await navigator.clipboard.writeText(PROMPT);
        button.textContent = '✓ コピーしました';
        status.textContent = 'ChatGPTに貼り付けて使ってください。';
      } catch (error) {
        // 埋め込み先がコピー権限を許可しない場合の代替手段
        const field = document.createElement('textarea');
        field.value = PROMPT;
        field.setAttribute('readonly', '');
        field.style.position = 'fixed';
        field.style.opacity = '0';
        document.body.appendChild(field);
        field.focus();
        field.select();
        let copied = false;
        try { copied = document.execCommand('copy'); } catch (_) {}
        field.remove();
        if (copied) {
          button.textContent = '✓ コピーしました';
          status.textContent = 'ChatGPTに貼り付けて使ってください。';
        } else {
          button.textContent = 'コピーする';
          status.textContent = 'Notion内でコピーできない場合は、このウィジェットを別タブで開いてください。';
        }
      }
    });
  </script>
</body>
</html>
